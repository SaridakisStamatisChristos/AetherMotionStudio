name: Core - Remotion and Kokoro
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      suite:
        description: Render suite (Foundry CPU by default; release pair or full only with explicit authorization)
        type: choice
        options: [release-pair, cpu-polished, full]
        default: cpu-polished
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feature/af-01-geometry-kernel' && github.event.before == '202ee715012c0e857461ec56c4df733a438c1608' && github.event.head_commit.message == 'AF09 repair two shared audio lanes') && !(github.event_name == 'push' && github.ref == 'refs/heads/feature/af-01-geometry-kernel' && github.event.before == '1615e8d31195b5122cddf479b171826ac02a506f' && github.event.head_commit.message == 'AF09 compare verified artifacts only') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: node scripts/foundry-qualify.mjs plan
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-af09-protocol
          path: out/foundry-af09-protocol/
          if-no-files-found: error
      - run: python -m py_compile scripts/*.py
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_*.py'
  render:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.suite == 'full' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/af-01-geometry-kernel' && github.event.before == '55e5c5536ec665badf069c9f9b646902db4bf27e' && github.event.head_commit.message == 'AF09 authorized final native full qualification')) && '["robot-treasure","blockchain-explainer","robot-lab","blockchain-60s","auto-robot","cinematic-cpu","cinematic-three","cinematic-cpu-polished","cinematic-three-polished","asset-showcase-cpu-polished","asset-showcase-three-polished","cinematography-cpu-polished","cinematography-three-polished","director-cpu-polished","director-three-polished","continuity-cpu-polished","continuity-three-polished","speech-cpu-polished","speech-three-polished","quality-cpu-polished","quality-three-polished","studio-cpu-polished","studio-three-polished","release-pair","foundry-af01-cpu-polished","foundry-af01-three-polished","foundry-af02-cpu-polished","foundry-af02-three-polished","foundry-af03-cpu-polished","foundry-af03-three-polished","foundry-af04-cpu-polished","foundry-af04-three-polished","foundry-af05-cpu-polished","foundry-af05-three-polished","foundry-af06-cpu-polished","foundry-af06-three-polished","foundry-af07-cpu-polished","foundry-af07-three-polished","foundry-af08-cpu-polished","foundry-af08-three-polished","foundry-af09-discovery-cpu-polished","foundry-af09-discovery-three-polished","foundry-af09-optimized-cpu-polished","foundry-af09-optimized-three-polished","foundry-af09-cpu-polished","foundry-af09-three-polished","foundry-af09-lab-cpu-polished","foundry-af09-lab-three-polished"]' || github.event_name == 'workflow_dispatch' && inputs.suite == 'release-pair' && '["release-pair"]' || '["foundry-af09-cpu-polished"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            requirements-release.txt
      - name: Install pinned Remotion runtime
        if: matrix.scene != 'release-pair'
        run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: models/kokoro
          key: kokoro-v1-int8-voices-v1
      - name: Clean release setup (no apt)
        if: matrix.scene == 'release-pair'
        timeout-minutes: 10
        run: python scripts/release_setup.py --ci
      - name: Install Python wheels (no apt)
        if: matrix.scene != 'release-pair'
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-ci.txt
      - name: Select bundled media tools
        run: python scripts/ci_media_tools.py
      - name: Prepare Kokoro model cache
        if: matrix.scene != 'release-pair'
        timeout-minutes: 4
        run: python scripts/setup_models.py
      - name: Compile original AF05 fixture
        if: startsWith(matrix.scene, 'foundry-af05-')
        run: node scripts/foundry-import-corpus.mjs
      - name: Compile AF07 Director fixture
        if: startsWith(matrix.scene, 'foundry-af07-')
        run: node scripts/foundry-generate.mjs
      - name: Compile AF08 portable story
        if: startsWith(matrix.scene, 'foundry-af08-')
        run: node scripts/foundry-packs.mjs acceptance
      - name: Render and verify
        run: |
          case "${{ matrix.scene }}" in
            release-pair) npm run produce -- --request examples/release.request.json --backend both --repair ;;
            studio-*) node scripts/studio-acceptance.mjs "${{ matrix.scene }}" ;;
            quality-*) npm run render -- examples/${{ matrix.scene }}.json --quality --repair ;;
            director-*|continuity-*|speech-*) npm run director -- --request examples/${{ matrix.scene }}.request.json --render ;;
            cinematic-cpu|cinematic-three|cinematic-cpu-polished|cinematic-three-polished|foundry-af05-*|foundry-af07-*|foundry-af08-*|foundry-af09-*) mkdir -p out/${{ matrix.scene }}; /usr/bin/time -f 'elapsed_seconds=%e\nmaximum_rss_kib=%M' -o out/${{ matrix.scene }}/qualification-process.txt npm run render -- examples/${{ matrix.scene }}.json; node scripts/foundry-qualify.mjs measure "${{ matrix.scene }}" ;;
            *) npm run render -- examples/${{ matrix.scene }}.json ;;
          esac
      - uses: actions/upload-artifact@v4
        if: matrix.scene != 'release-pair'
        with:
          name: aethermotion-${{ matrix.scene }}
          path: out/${{ matrix.scene }}/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && matrix.scene == 'release-pair'
        with:
          name: aethermotion-release-production
          path: out/release-production/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && matrix.scene == 'release-pair'
        with:
          name: aethermotion-release-cpu-polished
          path: out/release-cpu-polished/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && matrix.scene == 'release-pair'
        with:
          name: aethermotion-release-three-polished
          path: out/release-three-polished/
          if-no-files-found: warn
          retention-days: 30
  compare:
    if: always() && (github.event_name == 'workflow_dispatch' && inputs.suite == 'full' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/af-01-geometry-kernel' && github.event.before == '55e5c5536ec665badf069c9f9b646902db4bf27e' && github.event.head_commit.message == 'AF09 authorized final native full qualification'))
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: aethermotion-*
          path: comparison
      - run: python -m pip install numpy==2.2.6 imageio-ffmpeg==0.6.0
      - run: python scripts/compare_foundry_final.py comparison
      - run: python scripts/compare_backends.py comparison
      - run: python scripts/compare_fidelity.py comparison
      - run: python scripts/compare_phase_pairs.py comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-backend-comparison
          path: |
            comparison/comparison.json
            comparison/fidelity-comparison.json
            comparison/phase-pairs.json
            comparison/foundry-final-report.json
            comparison/*-review.jpg
