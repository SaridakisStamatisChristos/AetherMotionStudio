name: Core - Remotion and Kokoro
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: python -m py_compile scripts/*.py
  render:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scene: [robot-treasure, blockchain-explainer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: models/kokoro
          key: kokoro-v1-int8-voices-v1
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install -r requirements.txt
          python scripts/setup_models.py
      - name: Render and verify
        run: npm run render -- examples/${{ matrix.scene }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: aethermotion-${{ matrix.scene }}
          path: out/${{ matrix.scene }}/
          if-no-files-found: error
          retention-days: 30
