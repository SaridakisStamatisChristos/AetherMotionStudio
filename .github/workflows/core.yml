name: Core - Remotion and Kokoro
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: python -m py_compile scripts/*.py
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_*.py'
  render:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scene: [robot-treasure, blockchain-explainer, robot-lab, blockchain-60s, auto-robot, cinematic-cpu, cinematic-three, cinematic-cpu-polished, cinematic-three-polished]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install pinned Remotion runtime
        run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: models/kokoro
          key: kokoro-v1-int8-voices-v1
      - name: Install Python wheels (no apt)
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-ci.txt
      - name: Select bundled media tools
        run: python scripts/ci_media_tools.py
      - name: Prepare Kokoro model cache
        timeout-minutes: 4
        run: python scripts/setup_models.py
      - name: Render and verify
        run: npm run render -- examples/${{ matrix.scene }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: aethermotion-${{ matrix.scene }}
          path: out/${{ matrix.scene }}/
          if-no-files-found: error
          retention-days: 30
  compare:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: aethermotion-cinematic-*
          path: comparison
      - run: python -m pip install numpy==2.2.6 imageio-ffmpeg==0.6.0
      - run: python scripts/compare_backends.py comparison
      - run: python scripts/compare_fidelity.py comparison
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-backend-comparison
          path: |
            comparison/comparison.json
            comparison/fidelity-comparison.json
